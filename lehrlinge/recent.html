<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0f14"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Letzte Berichte – MurtalTaxi</title>

    <!-- фавиконки и манифест как на основной странице -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- шрифт и стили проекта -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="./assets/css/theme.css" as="style" />
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/global.css?v=20260912-3" />
    <link rel="stylesheet" href="../assets/css/app-shell.css?v=20260912-2" />
    <link rel="stylesheet" href="./assets/css/layout.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
    <style>
      /* Лёгкая сетка под список карточек */
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 16px;
        margin: 16px 0 12px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
      }
      .filters .ctrl {
        display: grid;
        gap: 6px;
        min-width: 165px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card, #fff);
        border-radius: var(--radius, 12px);
        padding: 14px;
        box-shadow: var(--shadow-card, 0 2px 12px rgba(0, 0, 0, 0.06));
      }
      .card h3 {
        margin: 0 0 6px;
        font: 600 16px/1.35 var(--font-family, "Montserrat", system-ui);
      }
      .card.is-duplicate { border: 2px solid #c56b16; }
      .duplicate-label { display: inline-block; margin: 0 0 8px; color: #9a4d00; font-weight: 700; font-size: 13px; }
      .report-edited { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; padding: 5px 7px; border-left: 3px solid var(--accent); border-radius: 4px; background: var(--accent-weak); color: var(--text); font-size: 12px; }
      .report-edited svg { flex: 0 0 14px; width: 14px; height: 14px; color: var(--accent); }
      .report-edited__text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .report-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
      .report-actions .btn { display: inline-grid; flex: 0 0 38px; place-items: center; width: 38px; height: 38px; padding: 0; }
      .report-actions svg { width: 20px; height: 20px; }
      .report-delete { color: #b42318; }
      .report-status { margin: 0 0 10px; }
      .report-dialog { color: var(--text); }
      .report-dialog::backdrop { background: color-mix(in oklab, var(--bg) 60%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .report-dialog h2 { margin: 0 35px 12px 0; font-size: 19px; }
      .report-dialog p { margin: 0 0 16px; line-height: 1.5; }
      .report-dialog .confirm-modal__actions .btn { flex: 0 0 auto; min-width: 120px; }
      .report-dialog__confirm { background: #b42318; color: #fff; border-color: #b42318; }
      .report-dialog__field { display: grid; gap: 5px; margin: 0 0 12px; }
      .report-dialog__field input, .report-dialog__field select { width: 100%; box-sizing: border-box; }
      .meta {
        color: var(--clr-text-light, #6b7280);
        font-size: 13px;
        line-height: 1.45;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        font-size: 14px;
      }
      .empty {
        padding: 24px;
        text-align: center;
        opacity: 0.7;
      }
      .pager {
        margin: 16px 0 32px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .pager button {
        min-width: 40px;
      }
      .back-link {
        text-decoration: none;
      }

      @media (max-width: 900px) {
        .filters {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          width: 100%;
        }
        .filters .ctrl {
          min-width: 0;
          width: 100%;
        }
        .filters .ctrl input,
        .filters .ctrl select,
        .filters .ctrl .btn {
          width: 100%;
          min-width: 0;
          box-sizing: border-box;
        }
      }

      @media (max-width: 420px) {
        .filters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="container">
        <header class="lehrlinge-brandbar app-header">
          <a class="back-btn lehrlinge-brandbar__back" href="./index.html" aria-label="Zurück zu Lehrlinge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></a>
          <a class="lehrlinge-brandbar__logo" href="./index.html" aria-label="Zur Lehrlinge-Startseite"><img src="../main/assets/img/logo1.png" alt="MurtalTaxi" /></a>
          <span class="lehrlinge-brandbar__title">Lehrlinge · Berichte</span>
          <span class="lehrlinge-brandbar__spacer"></span>
          <a class="lehrlinge-brandbar__call" href="tel:+436601018101" aria-label="MurtalTaxi anrufen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.56.57 1 1 0 011 1v3.61a1 1 0 01-1 1A17.02 17.02 0 013 5a1 1 0 011-1h3.61a1 1 0 011 1c0 1.22.2 2.41.57 3.56a1 1 0 01-.24 1.01l-2.32 2.22z" fill="currentColor" /></svg></a>
        </header>
      </div>
      <div class="container page__grid">
        <aside class="aside">
          <!-- Панель фильтров -->
          <section class="panel">
            <div class="rowHead">
              <h1 style="margin: 0; font-size: 22px">Letzte Berichte</h1>
              <div id="now" class="meta"></div>
            </div>

            <div class="filters" role="region" aria-label="Filter">
              <div class="ctrl">
                <label for="f_from">von</label>
                <input id="f_from" type="date" />
              </div>
              <div class="ctrl">
                <label for="f_to">bis</label>
                <input id="f_to" type="date" />
              </div>

              <div class="ctrl">
                <label for="f_route">Route</label>
                <select id="f_route">
                  <option value="">Alle Routen</option>
                  <option value="1">Route 1</option>
                  <option value="2">Route 2</option>
                </select>
              </div>
              <div class="ctrl">
                <label for="f_shift">Zeit</label>
                <select id="f_shift">
                  <option value="">Alle Zeiten</option>
                  <option value="Früh">Früh</option>
                  <option value="Nachmittag">Nachmittag</option>
                </select>
              </div>
              <div class="ctrl" style="align-self: end">
                <button class="btn" id="apply">Anwenden</button>
              </div>
            </div>

            <div class="bottom as-block">
              <div class="bottom__inner">
                <a class="btn-link back-link" href="./index.html">← Zurück</a>
                <a class="btn-link" href="./client-report.html">Kunden</a>
                <button
                  id="theme-toggle"
                  class="theme-btn theme-toggle"
                  type="button"
                  aria-label="Thema wechseln"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </button>
              </div>
            </div>
          </section>
        </aside>

        <section>
          <div id="reportStatus" class="meta report-status" role="status" aria-live="polite"></div>
          <div class="toolbar">
            <!-- <div class="meta" id="summary">Lade Daten…</div> -->
            <div class="pager" id="pager" hidden>
              <button class="btn" id="prev" disabled>‹</button>
              <span class="meta" id="pageInfo">1/1</span>
              <button class="btn" id="next" disabled>›</button>
            </div>
          </div>

          <div id="list" class="cards" role="list"></div>
          <div id="empty" class="empty" hidden>Keine Einträge</div>
        </section>
      </div>
    </main>

    <dialog id="deleteReportDialog" class="confirm-modal__dialog card report-dialog" aria-labelledby="deleteReportTitle" aria-describedby="deleteReportText">
      <button id="deleteReportClose" class="confirm-modal__close" type="button" aria-label="Schließen">✕</button>
      <h2 id="deleteReportTitle">Bericht ausblenden?</h2>
      <p id="deleteReportText"></p>
      <p id="deleteReportError" class="meta" role="alert" hidden></p>
      <div class="confirm-modal__actions">
        <button id="deleteReportConfirm" class="btn report-dialog__confirm" type="button">Ja, markieren</button>
      </div>
    </dialog>
    <dialog id="editReportDialog" class="confirm-modal__dialog card report-dialog" aria-labelledby="editReportTitle">
      <button id="editReportClose" class="confirm-modal__close" type="button" aria-label="Schließen">✕</button>
      <h2 id="editReportTitle">Bericht bearbeiten</h2>
      <form id="editReportForm">
        <label class="report-dialog__field">Datum <input id="editReportDate" type="date" required /></label>
        <label class="report-dialog__field">Zeit <select id="editReportShift" required><option value="Früh">Früh</option><option value="Nachmittag">Nachmittag</option></select></label>
        <label class="report-dialog__field">Route <select id="editReportRoute" required><option value="1">Route 1</option><option value="2">Route 2</option></select></label>
        <p id="editReportError" class="meta" role="alert" hidden></p>
        <div class="confirm-modal__actions"><button id="editReportSave" class="btn" type="submit">Speichern</button></div>
      </form>
    </dialog>

    <script type="module" src="./assets/js/theme.js" defer></script>
    <script src="./assets/js/api.js" defer></script>
    <script src="./assets/js/recent.js" defer></script>
  </body>
</html>
