<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0f14"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Lehrlingsfahrten MurtalTaxi</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Variable font: один запрос, веса 400–900 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="./assets/css/theme.css" as="style" />
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/global.css?v=20260912-3" />
    <link rel="stylesheet" href="../assets/css/app-shell.css?v=20260912-2" />
    <link rel="stylesheet" href="./assets/css/layout.css" />
    <link rel="stylesheet" href="./assets/css/components.css?v=20260902-3" />
    <link rel="stylesheet" href="./assets/css/responsive.css?v=20260902-2" />
  </head>
  <body>
    <main class="page">
      <div class="container">
        <header class="app-header">
          <button class="back-btn lehrlinge-brandbar__back" type="button" onclick="goHome()" aria-label="Zurück zur zentralen Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
          <a class="lehrlinge-brandbar__logo" href="../main/index.html" aria-label="Zur zentralen Startseite"><img src="../main/assets/img/logo1.png" alt="MurtalTaxi" /></a>
          <span class="lehrlinge-brandbar__title">Lehrlinge</span>
          <span class="lehrlinge-brandbar__spacer"></span>
          <a class="pill app-header__call" href="tel:+436601018101" aria-label="MurtalTaxi anrufen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.56.57 1 1 0 011 1v3.61a1 1 0 01-1 1A17.02 17.02 0 013 5a1 1 0 011-1h3.61a1 1 0 011 1c0 1.22.2 2.41.57 3.56a1 1 0 01-.24 1.01l-2.32 2.22z" fill="currentColor" /></svg></a>
        </header>
      </div>

      <div class="container page__grid">
        <!-- ЛЕВАЯ КОЛОНКА (ASIDE) -->
        <aside class="aside">
          <!-- Панель фильтров/переключателей -->
          <section class="panel">
            <div class="rowHead">
              <a class="back-btn plan-link" href="driver-plan.html" aria-label="Fahrtenplan öffnen">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 4h14v16H5V4zm3 3v2h8V7H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z" fill="currentColor" />
                </svg>
                <span>Fahrtenplan</span>
              </a>
              <div class="seg" aria-label="Route wählen">
                <button id="seg1" type="button" aria-pressed="true">
                  Route 1
                </button>
                <button id="seg2" type="button" aria-pressed="false">
                  Route 2
                </button>
              </div>
              <div id="now" aria-live="off"></div>
            </div>

            <div class="filters">
              <div class="ctrl">
                <label for="driver">Fahrer</label>
                <select id="driver" required>
                  <option value="" disabled selected>—</option>
                </select>
              </div>

              <div class="ctrl">
                <label for="car">Kennzeichen</label>
                <select id="car" required>
                  <option value="" disabled selected>—</option>
                </select>
              </div>

              <div class="ctrl">
                <label for="reportDate">Datum</label>
                <input id="reportDate" type="date" />
              </div>

              <div class="ctrl">
                <label for="shift">Zeit</label>
                <select id="shift">
                  <option value="Früh">Früh</option>
                  <option value="Nachmittag">Nachmittag</option>
                </select>
              </div>

              <label class="show-all-points" for="showAllPoints">
                <input id="showAllPoints" type="checkbox" />
                <span>Alle Punkte</span>
              </label>
            </div>
          </section>

          <!-- «Bottom» ПОД панелью (больше не fixed) -->
          <div class="bottom as-block">
            <div class="bottom__inner">
              <div>
                <div class="meta">Gesamtstrecke</div>
                <div class="total"><span id="total">0</span> km</div>
              </div>

              <button class="save" id="save">Speichern</button>
            </div>

            <!-- новая строка ссылок -->
            <div class="bottom__links links-grid">
              <a
                href="hilfe.html"
                class="link-item"
                aria-label="Hilfeseite öffnen"
              >
                <div class="icon-circle">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm.25 17a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 12.25 19ZM13.5 13a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1-.75-.75v-.5a2.5 2.5 0 0 1 2.5-2.5 1.5 1.5 0 1 0-1.5-1.5.75.75 0 0 1-1.5 0 3 3 0 1 1 3.75 2.9Z"
                      fill="currentColor"
                    />
                  </svg>
                </div>
                <span class="label">Hilfe</span>
              </a>

              <a
                href="recent.html"
                class="link-item"
                aria-label="Letzte Berichte anzeigen"
              >
                <div class="icon-circle">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5zm0 2h14v14H5V5zm3 2v2h8V7H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"
                      fill="currentColor"
                    />
                  </svg>
                </div>
                <span class="label">Berichte</span>
              </a>

              <a
                href="admin.html"
                class="link-item"
                aria-label="Admin öffnen"
              >
                <div class="icon-circle">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 3l7 4v10l-7 4-7-4V7l7-4zm0 4.2L8 9.4v5.2l4 2.2 4-2.2V9.4l-4-2.2zm0 2.1a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4z"
                      fill="currentColor"
                    />
                  </svg>
                </div>
                <span class="label">Admin</span>
              </a>

              <a
                href="#"
                id="theme-toggle"
                class="link-item theme-toggle-link"
                aria-label="Thema wechseln"
              >
                <div class="icon-circle theme-toggle-shell">
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </div>
                <span class="label">Theme</span>
              </a>

              <a
                href="https://taxi-lehrlinge-portal.vercel.app/"
                class="link-item portal-link"
                aria-label="Lehrlinge Portal öffnen"
                target="_blank"
                rel="noopener"
              >
                <div class="icon-circle">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 0 17.5 16H4V5.5Zm0 0V19a2 2 0 0 0 2 2h11.5A2.5 2.5 0 0 0 20 18.5V3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    <path d="M8 7h8M8 10.5h8M8 14h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  </svg>
                </div>
                <span class="label">Portal</span>
              </a>
            </div>
          </div>

          <!-- Подтверждение и последние отправки (останутся слева) -->
          <section
            id="recent"
            class="sidebar__box"
            style="display: none"
            aria-label="Letzte Sendungen"
          ></section>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА (СПИСОК) -->
        <section id="list" role="list" aria-live="polite">
          <select id="driver">
            <option value="">Wird geladen…</option>
          </select>
        </section>
      </div>
    </main>

    <section
      id="confirm"
      class="confirm-modal"
      hidden
      aria-label="Bestätigung"
      aria-live="polite"
    ></section>

    <script type="module" src="./assets/js/theme.js" defer></script>
    <script src="./assets/js/api.js" defer></script>
    <script src="./assets/js/function.js?v=20260903-1" defer></script>
    <script src="./assets/js/main.js" defer></script>
  </body>
</html>
